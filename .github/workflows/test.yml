name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r discord-auth/requirements.lock
      - run: python -m unittest discover -s discord-auth/tests -v
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm test
